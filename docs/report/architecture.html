  <text x="840" y="112" text-anchor="middle" class="s">tests → integration test → build &amp; push to ECR → rolling deploy → smoke test</text>

  <rect x="24" y="300" width="150" height="70" rx="35" fill="#fff" stroke="#232f3e" stroke-width="1.6"/>

  <text x="99" y="351" text-anchor="middle" class="s">web browser</text>

  <text x="212" y="179" font-size="14" font-weight="700" fill="#fff">AWS Cloud · ap-southeast-2 (Sydney)</text>
  <text x="250" y="228" font-size="15" font-weight="700" fill="#248814">VPC 10.0.0.0/16</text>
  <text x="520" y="228" text-anchor="middle" class="s" font-weight="700">Availability Zone ap-southeast-2a</text>
  <text x="905" y="228" text-anchor="middle" class="s" font-weight="700">Availability Zone ap-southeast-2b</text>

  <!-- public tier -->
  <rect x="330" y="276" width="630" height="54" rx="8" class="alb"/>
  <text x="645" y="299" text-anchor="middle" class="t">Public Application Load Balancer (internet-facing)</text>
  <text x="645" y="319" text-anchor="middle" class="s">HTTP :80 → target group web-tg (health /healthz) · SG: 80 from 0.0.0.0/0</text>

  <text x="485" y="404" text-anchor="middle" class="t">EC2 t3.micro · web</text>
  <text x="485" y="424" text-anchor="middle" class="s">Nginx container: React build</text>
  <text x="485" y="442" text-anchor="middle" class="s">+ /api reverse proxy</text>
  <rect x="660" y="378" width="270" height="76" rx="8" class="ec2"/>
  <text x="795" y="404" text-anchor="middle" class="t">EC2 t3.micro · web</text>
  <text x="795" y="424" text-anchor="middle" class="s">Nginx container: React build</text>
  <text x="795" y="442" text-anchor="middle" class="s">+ /api reverse proxy</text>
  <rect x="990" y="378" width="180" height="76" rx="8" fill="#fff" stroke="#8c4fff" stroke-width="1.8"/>
  <text x="1080" y="404" text-anchor="middle" class="t">NAT Gateway</text>

  <text x="795" y="700" text-anchor="middle" class="s">JWT auth · reports · PDF/CSV</text>

  <text x="500" y="834" text-anchor="middle" class="t">EC2 t3.small · MongoDB 7</text>

  <rect x="690" y="836" width="200" height="80" rx="8" fill="#fff" stroke="#3f8624" stroke-width="1.8"/>
  <text x="790" y="864" text-anchor="middle" class="t">EBS gp3 volume</text>
  <text x="790" y="884" text-anchor="middle" class="s">20 GiB · encrypted</text>
  <text x="790" y="902" text-anchor="middle" class="s">/data/mongo (persistent)</text>

  <!-- security legend -->
  <text x="300" y="997" class="s" font-weight="700" fill="#7a5b00">Security boundaries (security groups chained by reference = least privilege)</text>
  <text x="300" y="1019" class="s">Internet :80 → public ALB → web :80 → internal ALB :80 → app :5000 → MongoDB :27017 (each tier accepts only the tier in front of it)</text>
  <text x="300" y="1041" class="s">No SSH / no key pairs (SSM only) · IMDSv2 hop-limit 1 · non-root containers · encrypted EBS, S3 and ECR · secrets only in Secrets Manager</text>
  <text x="300" y="1063" class="s">CI credentials: scoped IAM user in GitHub encrypted secrets (push 2 ECR repos, set 2 parameters, run commands on project instances)</text>

  <!-- regional services -->
  <text x="1385" y="228" text-anchor="end" class="s" font-weight="700">Regional AWS services</text>
  <rect x="1235" y="242" width="325" height="74" rx="8" class="svc"/>
  <text x="1398" y="268" text-anchor="middle" class="t">Amazon ECR</text>
  <text x="1398" y="288" text-anchor="middle" class="s">expense-tracker-web · expense-tracker-app</text>
  <text x="1398" y="305" text-anchor="middle" class="s">immutable SHA tags · scan on push</text>
  <rect x="1235" y="336" width="325" height="74" rx="8" class="svc"/>
  <text x="1398" y="362" text-anchor="middle" class="t">AWS Systems Manager</text>
  <text x="1398" y="382" text-anchor="middle" class="s">Parameter Store: release image tag per tier</text>
  <text x="1398" y="399" text-anchor="middle" class="s">Run Command: rolling deploy (no SSH)</text>
  <rect x="1235" y="560" width="325" height="74" rx="8" class="svc"/>
  <text x="1398" y="586" text-anchor="middle" class="t">AWS Secrets Manager</text>
  <text x="1398" y="606" text-anchor="middle" class="s">app: MONGO_URI, JWT_SECRET</text>
  <text x="1398" y="623" text-anchor="middle" class="s">db: MongoDB root credentials</text>
  <rect x="1235" y="660" width="325" height="74" rx="8" class="svc"/>
  <text x="1398" y="686" text-anchor="middle" class="t">Amazon CloudWatch</text>
  <text x="1398" y="706" text-anchor="middle" class="s">log groups web / app / db · alarms (SNS)</text>
  <text x="1398" y="723" text-anchor="middle" class="s">dashboard · ASG scaling metrics</text>
  <rect x="1235" y="836" width="325" height="80" rx="8" class="svc"/>
  <text x="1398" y="862" text-anchor="middle" class="t">Amazon S3</text>
  <text x="1398" y="882" text-anchor="middle" class="s">DB backup bucket (private, encrypted,</text>
  <text x="1398" y="899" text-anchor="middle" class="s">TLS-only, 14-day lifecycle)</text>

  <text x="297" y="262" class="bandP">PUBLIC SUBNETS 10.0.1.0/24 (2a) · 10.0.2.0/24 (2b) · route 0.0.0.0/0 → Internet Gateway</text>
  <text x="297" y="520" class="bandA">PRIVATE APP SUBNETS 10.0.11.0/24 (2a) · 10.0.12.0/24 (2b) · no public IPs · route 0.0.0.0/0 → NAT</text>
  <text x="297" y="792" class="bandD">PRIVATE DB SUBNETS 10.0.21.0/24 (2a) · 10.0.22.0/24 (2b) · no public IPs · outbound only via NAT</text>
  <text x="342" y="368" class="asgP">Web Auto Scaling Group (min 2 · max 4) · SG web: 80 from public-ALB SG only</text>
  <text x="342" y="624" class="asgA">App Auto Scaling Group (min 2 · max 4) · SG app: 5000 from internal-ALB SG only</text>

  <text x="268" y="294" class="lbl">HTTP :80</text>
  <text x="495" y="492" class="lbl">/api/* reverse proxy → internal ALB :80</text>
  <text x="805" y="756" class="lbl">MongoDB :27017</text>
  <text x="942" y="684" class="lblg">outbound via NAT</text>
  <text x="1124" y="590" class="lblg">secrets at start</text>
  <text x="1090" y="726" class="lblg">container logs</text>
  <text x="905" y="918" class="lblg">daily mongodump → backups/</text>

  <text x="1135" y="74" class="lblb">① docker push (commit-SHA tag)</text>
  <text x="1244" y="146" text-anchor="end" class="lblb">② set release tag + send-command</text>
  <text x="1245" y="446" class="lblb">③ SSM runs deploy.sh on each web/app</text>
  <text x="1245" y="464" class="lblb">instance, one at a time: pull image</text>
  <text x="1245" y="482" class="lblb">from ECR, restart, wait for health check</text>
